name: Check shared browser contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shared-browser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/sync-shared.py --check